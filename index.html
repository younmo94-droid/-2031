<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>우리팀 업무 허브</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: rgba(0,0,0,0.05); }
  html, body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "맑은 고딕", sans-serif; background: #f4f6fa; color: #222; }
  body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  header { background: linear-gradient(135deg, #4f7cff 0%, #6f5cff 100%); color: #fff; padding: 20px 18px 24px; position: sticky; top: 0; z-index: 50; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  header h1 { margin: 0 0 4px; font-size: 20px; font-weight: 700; }
  header .sub { font-size: 12px; opacity: 0.85; }
  .main-wrap { padding: 16px; max-width: 720px; margin: 0 auto; }
  .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .cat-card { background: #fff; border-radius: 16px; padding: 22px 14px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); cursor: pointer; transition: transform 0.1s; }
  .cat-card:active { transform: scale(0.97); }
  .cat-card .emoji { font-size: 38px; display: block; margin-bottom: 8px; }
  .cat-card .name { font-size: 15px; font-weight: 600; color: #333; }
  .cat-card .count { font-size: 11px; color: #999; margin-top: 4px; }
  .utils { display: flex; gap: 8px; flex-wrap: wrap; }
  .util-btn { flex: 1; min-width: 110px; background: #fff; border: 1px solid #e1e5ee; border-radius: 12px; padding: 12px 8px; font-size: 13px; color: #555; cursor: pointer; font-weight: 500; }
  .util-btn:active { background: #f0f3fa; }
  .util-btn.danger { color: #e64545; border-color: #f5d0d0; }
  .page { display: none; padding: 16px; max-width: 720px; margin: 0 auto; padding-bottom: 100px; }
  .page.active { display: block; }
  .back-btn { background: #fff; border: 1px solid #e1e5ee; border-radius: 10px; padding: 8px 14px; font-size: 13px; color: #555; cursor: pointer; margin-bottom: 14px; }
  .page-title { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
  .page-sub { font-size: 12px; color: #999; margin-bottom: 18px; }
  .item { background: #fff; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
  .item-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
  .item-title { font-size: 15px; font-weight: 600; color: #333; flex: 1; word-break: break-word; }
  .item-meta { font-size: 11px; color: #aaa; }
  .item-body { font-size: 14px; color: #444; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
  .item-body.empty-text { color: #bbb; font-style: italic; }
  .item-actions { display: flex; gap: 6px; margin-top: 10px; }
  .ia-btn { flex: 1; border: none; border-radius: 8px; padding: 8px; font-size: 12px; cursor: pointer; font-weight: 500; }
  .ia-btn.edit { background: #eef2ff; color: #4f7cff; }
  .ia-btn.del { background: #fdecec; color: #e64545; }
  .ia-btn.up, .ia-btn.down { background: #f3f3f3; color: #666; }
  .fab-wrap { position: fixed; bottom: 24px; right: 24px; display: none; }
  .fab-wrap.active { display: block; }
  .fab { width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #4f7cff, #6f5cff); color: #fff; border: none; font-size: 30px; box-shadow: 0 6px 20px rgba(79,124,255,0.4); cursor: pointer; }
  .fab:active { transform: scale(0.93); }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 999; padding: 20px; }
  .modal-overlay.active { display: flex; }
.modal { background: #fff; border-radius: 20px; padding: 22px 18px; max-width: 420px; width: 100%; max-height: 85vh; overflow-y: auto; }
  .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 14px; color: #333; }
  .modal label { display: block; font-size: 12px; color: #666; margin: 10px 0 4px; font-weight: 500; }
  .modal input, .modal textarea { width: 100%; border: 1px solid #d8dde7; border-radius: 10px; padding: 10px 12px; font-size: 14px; font-family: inherit; outline: none; resize: vertical; }
  .modal input:focus, .modal textarea:focus { border-color: #4f7cff; }
  .modal textarea { min-height: 100px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 18px; }
  .modal-actions button { flex: 1; border: none; border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .modal-actions .cancel { background: #f0f3fa; color: #666; }
  .modal-actions .save { background: #4f7cff; color: #fff; }
  .empty { text-align: center; color: #aaa; padding: 40px 20px; font-size: 14px; }
  .toast { position: fixed; top: 30%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: #fff; padding: 14px 22px; border-radius: 12px; z-index: 9999; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>📂 우리팀 업무 허브</h1>
  <div class="sub">카테고리를 골라 자유롭게 기록하세요</div>
</header>
